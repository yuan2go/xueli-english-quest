name: Tabby UI verification
on:
  push:
    branches: [feat/tabby-papertrail-ui-20260917]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tabby-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reproducible source and installed dependencies
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
          tar -czf "$RUNNER_TEMP/node-modules.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: tabby-build-inputs
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/node-modules.tar.gz
          retention-days: 2
      - run: npm test
      - run: npm run build
      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabby-ui-evidence
          path: |
            dist/
            test-results/
            playwright-report/
            docs/evidence/tabby-ui/
          if-no-files-found: ignore
          retention-days: 7
