name: Verified art import (one shot)
on:
  push:
    branches: [design/art-recovery-20260917]
permissions:
  contents: write
jobs:
  import:
    if: contains(github.event.head_commit.message, '[art-import]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: design/art-recovery-20260917
      - name: Reassemble exact binary files from verified Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,hashlib,zlib,urllib.request,pathlib
          spec=json.loads(pathlib.Path('.art-import.json').read_text())
          receipts=[]
          for item in spec['assets']:
              path=pathlib.PurePosixPath(item['path'])
              assert '..' not in path.parts and item['path'].startswith('public/assets/game/')
              pieces=[]
              for part in item['chunks']:
                  sha=part['sha']
                  url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
                  with urllib.request.urlopen(req,timeout=30) as response: record=json.load(response)
                  blob=base64.b64decode(record['content'])
                  assert hashlib.sha1(b'blob '+str(len(blob)).encode()+b'\0'+blob).hexdigest()==sha
                  pieces.append(zlib.decompress(blob) if part['codec']=='zlib' else blob)
              data=b''.join(pieces)
              assert len(data)==item['bytes'],item['path']
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
              if path.suffix=='.webp': assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              else: assert path.suffix=='.mp3' and data[:3]==b'ID3'
              dest=pathlib.Path(path)
              assert not dest.exists() or dest.read_bytes()==data
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              receipts.append({'path':item['path'],'bytes':len(data),'sha256':item['sha256'],'git_blob_sha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()})
              print(item['path'],len(data),item['sha256'])
          out=pathlib.Path('design/evidence/remote-import.json');out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'status':'BINARY_IMPORT_VERIFIED','scope':'byte integrity only; not art, teaching-audio, device or release approval','files':receipts},indent=2)+'\n')
          pathlib.Path('.art-import.json').unlink()
          pathlib.Path('.github/workflows/art-import-once.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/game design/evidence/remote-import.json .art-import.json .github/workflows/art-import-once.yml
          git commit -m 'design: import byte-verified art and development audio files'
          git push origin HEAD:design/art-recovery-20260917
