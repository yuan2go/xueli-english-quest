name: Tabby UI workspace
on:
  push:
    branches: [design/tabby-identity-ui-20260917]
    paths: [.github/workflows/tabby-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: git archive HEAD public/assets/game/tabby -o scene-assets.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tabby-scene-inputs
          path: scene-assets.tar
          retention-days: 1
