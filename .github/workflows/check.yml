name: WordSpell checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordspell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.16.0'
      - name: Domain tests
        run: npm test
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Browser checks against production HTTP app
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Save build and resolved lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordspell-playable-story
          path: |
            dist/
            package-lock.json
            docs/evidence/playable-story/
          retention-days: 3
